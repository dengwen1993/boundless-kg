[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kg-engine"
version = "1.0.0"
description = "Production-grade knowledge graph engine (refactored from kg_deepagents_demo)"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "aiofiles>=23.2.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "sse-starlette>=2.0.0",
    "langchain-core>=0.1.0",
    "tenacity>=8.2.0",
    "structlog>=24.0.0",
    # Graph database + search
    "falkordb>=1.0.0",
    "numpy>=1.24.0",
    "rank-bm25>=0.2.2",
    # Document parsing for chat attachments (.pdf / .docx / .pptx / .xlsx)
    # — preferred path in src.application.tmp_parser; stdlib zipfile
    # fallback keeps DOCX/PPTX parsing working even if markitdown is missing.
    # pypdf is a hard dep — the kg_parse_uploaded_file tool expects it
    # (see BUG-2026-08-20-005 in workspace/bugs.md).
    "pypdf>=5.0.0",
    "markitdown[pptx,docx,xlsx]>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]
deepagents = [
    "deepagents>=0.1.0",
    "langchain-anthropic>=0.1.0",
    "langgraph>=0.1.0",
]

[project.scripts]
kg-engine = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]